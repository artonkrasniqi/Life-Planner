name: Deploy to GitHub Pages

# Hinweis: Die Umgebung "github-pages" nimmt Veröffentlichungen nur vom
# Standard-Branch an. Andere Branches hier einzutragen bringt nichts —
# der Lauf bricht sofort mit "environment protection rules" ab. Damit die
# Lern-App unter /kosovarisch/ online geht, muss ihr Branch also in den
# Standard-Branch übernommen werden (oder unter Settings → Environments →
# github-pages als erlaubter Deployment-Branch eingetragen werden).
on:
  push:
    branches:
      - main
      - claude/life-planner-dashboard-wq41o1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nur die Anwendung veröffentlichen — nicht .git und nicht die Workflows.
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r styles src icons _site/
          cp README.md _site/ || true
          # Zweite App: die Lern-App liegt unter /kosovarisch/ und
          # bringt eigenes HTML, Manifest und eigenen Service Worker mit.
          cp -r kosovarisch _site/

      # Kein enablement: true — der Automatik-Token von Actions darf die
      # Pages-Seite nicht anlegen ("Resource not accessible by integration").
      # Pages muss einmalig unter Settings → Pages auf "GitHub Actions"
      # gestellt werden; danach läuft jeder weitere Lauf ohne Zutun durch.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
